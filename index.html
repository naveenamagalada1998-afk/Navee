<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A45F5">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reelmaker</title>
<style>
:root{--paper:#EDF0F4;--card:#fff;--ink:#16203A;--muted:#5B6680;--line:#C9D0DC;--accent:#2A45F5;--on-accent:#fff;--err:#B3261E}
@media (prefers-color-scheme:dark){:root{--paper:#141A2B;--card:#1C2438;--ink:#E8ECF6;--muted:#9AA5C0;--line:#2E3852;--accent:#7C93FF;--on-accent:#0E1430;--err:#FF8A80}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
h1{font-size:28px;letter-spacing:-.02em;margin:24px 0 4px;font-weight:800}
.sub{color:var(--muted);margin:0 0 20px}
label{display:block;font-weight:600;margin:16px 0 6px}
textarea,select,input{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px}
textarea{min-height:120px;resize:vertical}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;cursor:pointer}
#go{width:100%;margin-top:16px;padding:14px;background:var(--accent);color:var(--on-accent)}
#go:disabled{opacity:.5;cursor:default}
#status{min-height:1.5em;margin:12px 0 0;color:var(--muted)}
#status.err{color:var(--err);font-weight:600}
.reel{position:relative;background:#10141F;border-radius:6px;padding:16px 28px;margin:20px 0 8px}
.reel::before,.reel::after{content:"";position:absolute;top:10px;bottom:10px;width:11px;background:repeating-linear-gradient(to bottom,var(--paper) 0 10px,transparent 10px 22px);border-radius:2px}
.reel::before{left:8px}.reel::after{right:8px}
.reel video{display:block;width:100%;max-height:70vh;background:#000}
.actions{display:flex;gap:10px;align-items:center;justify-content:space-between}
.actions p{margin:0;color:var(--muted);font-size:14px;flex:1}
.actions a{color:var(--accent);font-weight:700;text-decoration:none}
h2{font-size:18px;margin:28px 0 8px}
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item button{background:transparent;color:var(--accent);padding:6px 10px}
details{margin-top:24px;color:var(--muted)}
summary{cursor:pointer;font-weight:600}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){#go{transition:opacity .15s}}
</style>
</head>
<body>
<main>
  <h1>Reelmaker</h1>
  <p class="sub">Describe a scene. Get a short video.</p>

  <label for="prompt">Prompt</label>
  <textarea id="prompt" maxlength="1000" placeholder="A red fox running through a snowy forest at sunrise, cinematic, slow motion"></textarea>

  <label for="model">Model</label>
  <select id="model"></select>

  <button id="go">Generate video</button>
  <p id="status" role="status" aria-live="polite"></p>

  <section id="result" hidden>
    <div class="reel"><video id="player" controls playsinline loop></video></div>
    <div class="actions"><p id="caption"></p><a id="dl" target="_blank" rel="noopener">Download</a></div>
  </section>

  <section id="histWrap" hidden>
    <h2>Recent videos</h2>
    <div id="hist"></div>
  </section>

  <details id="access">
    <summary>Access password</summary>
    <label for="pw">Password set on your server</label>
    <input id="pw" type="password" autocomplete="current-password">
  </details>
</main>

<script>
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
let busy = false;

$('#pw').value = store.get('rm_pw', '');
if (!$('#pw').value) $('#access').open = true;

function setStatus(msg, err) { const s = $('#status'); s.textContent = msg; s.className = err ? 'err' : ''; }

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'x-app-password': $('#pw').value } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || 'Request failed (' + r.status + ')');
  return j;
}

function show(url, prompt) {
  $('#result').hidden = false;
  $('#player').src = url;
  $('#player').play().catch(() => {});
  $('#caption').textContent = prompt;
  $('#dl').href = url;
}

function renderHist() {
  const h = store.get('rm_hist', []);
  $('#histWrap').hidden = !h.length;
  $('#hist').replaceChildren(...h.map(it => {
    const row = document.createElement('div'); row.className = 'item';
    const t = document.createElement('span'); t.textContent = it.prompt;
    const b = document.createElement('button'); b.textContent = 'Play';
    b.onclick = () => { show(it.url, it.prompt); scrollTo({ top: 0, behavior: 'smooth' }); };
    row.append(t, b); return row;
  }));
}

async function generate() {
  const prompt = $('#prompt').value.trim();
  if (!prompt || busy) return;
  store.set('rm_pw', $('#pw').value);
  busy = true; $('#go').disabled = true; setStatus('Sending prompt...');
  const model = $('#model').value, t0 = Date.now();
  try {
    const { id } = await api('/api/generate', { method: 'POST', body: JSON.stringify({ prompt, model }) });
    while (true) {
      await sleep(4000);
      const secs = Math.round((Date.now() - t0) / 1000);
      const s = await api('/api/status?model=' + encodeURIComponent(model) + '&rid=' + encodeURIComponent(id));
      if (s.state === 'done') {
        show(s.url, prompt);
        store.set('rm_hist', [{ prompt, url: s.url }, ...store.get('rm_hist', [])].slice(0, 20));
        renderHist(); setStatus(''); break;
      }
      if (s.state === 'error') throw new Error(s.message || 'Generation failed.');
      setStatus((s.state === 'queued' ? 'Waiting in queue... ' : 'Generating... ') + secs + 's');
      if (secs > 600) throw new Error('Timed out after 10 minutes. Try again.');
    }
  } catch (e) { setStatus(e.message, true); }
  finally { busy = false; $('#go').disabled = false; }
}

$('#go').onclick = generate;
fetch('/api/models').then(r => r.json()).then(ms => {
  $('#model').replaceChildren(...ms.map(m => new Option(m.label, m.id)));
}).catch(() => setStatus('Cannot reach the server.', true));
renderHist();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
